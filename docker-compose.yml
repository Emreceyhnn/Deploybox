services:
  client:
    image: emrecyhn/deploybox-client:latest
    container_name: deploybox-client
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - default
      - gateway-network
    depends_on:
      - db
      - redis

  orchestrator:
    image: emrecyhn/deploybox-orchestrator:latest
    container_name: deploybox-orchestrator
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/gateway/conf.d:/etc/nginx/conf.d
    networks:
      - default
      - gateway-network
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    container_name: deploybox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}"
      POSTGRES_DB: deploybox
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: deploybox-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set — see .env.example}
    volumes:
      - redis-data:/data
    networks:
      - default

networks:
  default:
  gateway-network:
    name: gateway-network
    external: true

volumes:
  db-data:
  redis-data:
